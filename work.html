.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:48px 24px}
.wk-c{display:flex;flex-direction:column;gap:16px;min-width:0}
.wk-cov{position:relative;display:grid;grid-template-columns:1fr 32%;aspect-ratio:4/5;border-radius:22px;overflow:hidden;color:#fff;isolation:isolate;text-decoration:none}
.wk-cov .f{position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.wk-cov .f::before{content:"";position:absolute;inset:-20%;z-index:-1;background:var(--g);filter:blur(28px);transition:filter .6s ease}
.wk-cov .f::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;opacity:.5}
a.wk-cov:hover .f::before{filter:blur(10px)}
.wk-cov .s{background:#0A7A6E;color:#fff;padding:20px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-family:'Geist Mono',monospace;font-size:11.5px;line-height:1.5;letter-spacing:.04em}
.wk-cov .s .t{text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;opacity:.85}
.wk-cov .n{margin:0;font-family:'Geist Mono',monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
.wk-cov h2{margin:0;font-family:'Geist Mono',monospace;font-weight:500;font-size:clamp(26px,2.6vw,36px);line-height:1.04;letter-spacing:-.055em;word-spacing:-.18em;text-wrap:balance}
.wk-cov .dot{width:12px;height:12px;border-radius:50%;background:#fff}
.wk-cov.skin{--g:radial-gradient(60% 50% at 30% 30%,#F3C2B1 0%,transparent 70%),radial-gradient(70% 60% at 70% 80%,#E9765E 0%,transparent 70%),radial-gradient(50% 50% at 20% 85%,#B4ADA6 0%,transparent 70%),#C9A39A}
.wk-cov.air{--g:radial-gradient(60% 50% at 30% 30%,#BFE3E6 0%,transparent 70%),radial-gradient(70% 60% at 70% 75%,#3E7F96 0%,transparent 70%),radial-gradient(50% 50% at 20% 85%,#E5E9EA 0%,transparent 70%),#7FAFBC;color:#0D1413}
.wk-cov:focus-visible{outline:2px solid #0A7A6E;outline-offset:4px}
.wk-tags{display:flex;flex-wrap:wrap;gap:6px}
.wk-tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;background:#0A7A6E;color:#fff;font-family:'Geist Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.wk-tag.o{background:transparent;color:#0D1413;box-shadow:inset 0 0 0 1px #0D1413}
.wk-d{margin:0;font-size:17px;line-height:1.55;max-width:52ch}
.wk-c .wk-link{align-self:flex-start}

.brk{position:relative;overflow:hidden;border-radius:30px;min-height:min(72vh,660px);display:flex;color:#fff;isolation:isolate;background:#9a8f8a}
.brk-bg{position:absolute;inset:-8%;background:url(img/skin-infection.jpg) center/cover;filter:blur(var(--b,44px)) saturate(1.15);transform:scale(1.08);z-index:-2;will-change:filter}
.brk-sh{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,13,14,0) 35%,rgba(15,13,14,.55) 100%)}
.brk::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;opacity:.55}
.brk-in{position:relative;flex:1;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;padding:clamp(20px,3vw,36px);gap:16px}
.brk-issue,.brk-meta{margin:0;font-family:'Geist Mono',monospace;font-size:13px;line-height:1.4;letter-spacing:.06em}
.brk-issue{text-transform:uppercase}
.brk-meta{justify-self:end;text-align:right}
.brk-cross{grid-column:1/-1;align-self:end;justify-self:start;position:relative;padding:18px 26px 18px 0}
.brk-cross h1{margin:0;font-family:'Geist Mono',monospace;font-weight:500;font-size:clamp(42px,7.4vw,112px);line-height:1;letter-spacing:-.06em;word-spacing:-.18em;color:#fff}
.brk-cross::before{content:"";position:absolute;left:-200vw;right:-12px;top:50%;height:1px;background:currentColor;opacity:.55}
.brk-cross::after{content:"";position:absolute;right:0;top:-30px;bottom:-30px;width:1px;background:currentColor;opacity:.55}
.brk-cross i{position:absolute;right:-5px;top:calc(50% - 5px);width:11px;height:11px;border-radius:50%;background:#0A7A6E;box-shadow:0 0 0 2px #fff}
.brk-foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.92}
.brk-thr{display:flex;align-items:center;gap:10px}
.brk-thr s{display:block;width:120px;height:1px;background:rgba(255,255,255,.5);position:relative;text-decoration:none}
.brk-thr s b{position:absolute;top:-4px;left:calc(var(--p,0) * 111px);width:9px;height:9px;border-radius:50%;background:#fff}

@media (prefers-reduced-motion:reduce){.brk-bg{filter:saturate(1.1)!important}}

  }

  componentWillUnmount() {

    for (const g of c.segs) {

      if (take > 0) segs.push({ text: g[0].slice(0, take), plain: !g[1], acc: !!g[1], words: g[1] ? (function (tx) { var ws = tx.split(' '); if (ws.length <= 3) ws = [ws.join('\u00A0')]; else ws = ws.slice(0, -2).concat([ws[ws.length - 2] + '\u00A0' + ws[ws.length - 1]]); var out = [], ii = 0; for (var q = 0; q < ws.length; q++) { var ch = []; for (var c = 0; c < ws[q].length; c++) ch.push({ c: ws[q][c], i: ii++ }); out.push({ ch: ch, sp: q < ws.length - 1 ? ' ' : '' }); } return out; })(g[0].slice(0, take)) : [], cls: '', style: g[1] ? "--a: " + (dk ? pal[0] : pal[1]) + "; --b: " + (dk ? '#FFF4E4' : '#C2483C') : '' });
    }

      refRevS: refs.revS, refRevG: refs.revG, refRevA: refs.revA, refRevC: refs.revC,
      revS: seen.S ? 'is-in' : '', revG: seen.G ? 'is-in' : '', revA: seen.A ? 'is-in' : '', revC: seen.C ? 'is-in' : '',
      refLogo: refs.logo, refDoodle: refs.doodle, refDStage: refs.dstage, refIris: refs.iris, refDSec: refs.dsec, replay: this.replayH || (this.replayH = () => { this.dT0 = this.now || 0; this.dLast = -1; this.userMoved = false; this.azDone = false; }), refStory: refs.story, refStorySec: refs.sec, refVid: refs.vid, refVid2: refs.vid2, refCStory: refs.cStory, refInv: refs.inv, refVis: refs.vis, refCode: refs.code, refCulture: refs.culture, refP1: refs.p1, refP2: refs.p2, refP3: refs.p3, plant: this.plantHandler(),
      segs: segs,
      chLabel: c.label,
      chSub: c.sub,

      cursorCol: dk ? '#39E58C' : '#0B7A57',
      bgCol: dk ? '#0F0D0E' : '#F3F3F1',
      fgCol: dk ? '#F2F2F0' : '#141210',
      mutedCol: dk ? '#A79C97' : '#6B635D',
      subCol: dk ? '#C9C0BB' : '#4A433F',
      trackCol: dk ? 'rgba(244,239,233,0.25)' : 'rgba(20,18,16,0.2)',
      borderCol: dk ? 'rgba(244,239,233,0.35)' : 'rgba(20,18,16,0.3)',
      fadeGrad: dk ? 'linear-gradient(to top, rgba(15,13,14,0.85), rgba(15,13,14,0))' : 'linear-gradient(to top, rgba(241,236,229,0.92), rgba(241,236,229,0))'

  }
}

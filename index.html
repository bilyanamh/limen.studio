      mutedCol: dk ? '#A79C97' : '#6B635D',
      subCol: dk ? '#C9C0BB' : '#4A433F',
      trackCol: dk ? 'rgba(244,239,233,0.25)' : 'rgba(20,18,16,0.2)',
      borderCol: dk ? 'rgba(244,239,233,0.35)' : 'rgba(20,18,16,0.3)',
      fadeGrad: dk ? 'linear-gradient(to top, rgba(15,13,14,0.85), rgba(15,13,14,0))' : 'linear-gradient(to top, rgba(241,236,229,0.92), rgba(241,236,229,0))'
    };
  }
}

  render(html`<${Component} ...${{"accent": "oxblood", "motion": true}} />`, document.getElementById('app'));
})();
</script>
